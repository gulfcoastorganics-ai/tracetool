name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: python -m pytest -q
      - name: Smoke backend health endpoint
        run: |
          uvicorn backend.api.main:app --host 127.0.0.1 --port 4316 >/tmp/chain-trace-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4316/health >/tmp/chain-trace-health.json; then
              break
            fi
            sleep 0.25
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/chain-trace-health.json').read_text())
          assert payload.get('status') == 'healthy', payload
          PY
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - name: Smoke production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4317 >/tmp/chain-trace-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4317/ >/tmp/chain-trace-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/chain-trace-index.html
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
