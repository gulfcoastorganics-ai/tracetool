version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - bitcoin-blocks:/bitcoin/.bitcoin
      - ./data:/app/data
    environment:
      - BTC_RPC_HOST=bitcoind
      - BTC_RPC_PORT=8332
      - BTC_RPC_USER=${BTC_RPC_USER:-bitcoin}
      - BTC_RPC_PASSWORD=${BTC_RPC_PASSWORD:-hashpw}
    depends_on:
      - bitcoind
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

  bitcoind:
    image: ruimarinho/bitcoin-core:27
    ports:
      - "8332:8332"
      - "8333:8333"
    volumes:
      - bitcoin-blocks:/bitcoin/.bitcoin
    command: [
      "-regtest",
      "-rpcallowip=0.0.0.0/0",
      "-rpcbind=0.0.0.0",
      "-rpcuser=${BTC_RPC_USER:-bitcoin}",
      "-rpcpassword=${BTC_RPC_PASSWORD:-hashpw}",
      "-txindex=1"
    ]
    restart: unless-stopped

volumes:
  bitcoin-blocks: